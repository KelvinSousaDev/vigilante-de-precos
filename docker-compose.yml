version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: vigilante_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: vigilante_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: vigilante_app
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:admin@db:5432/vigilante_db
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    command: >
      sh -c "python ExeDoBanco/setup_banco.py &&
             python ExeDoBanco/migracao_fase3.py &&
             python ExeDoBanco/setup_logs.py &&
             python ExeDoBanco/criar_visitante.py &&
             streamlit run dashboard.py"
volumes:
  postgres_data:
